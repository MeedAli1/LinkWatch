<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Subtle Dark Metallic Slate -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#0B0E14" />
    </linearGradient>

    <!-- Radar Sweep Glow -->
    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="pulseLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="75%" stop-color="#00F0FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Container Base Plate (Crisp Native Windows Rounded Rect) -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGrad)" stroke="#1F242D" stroke-width="4" />

  <!-- Inner Precise Hairline Border -->
  <rect x="24" y="24" width="464" height="464" rx="88" ry="88" fill="none" stroke="#262B36" stroke-width="1.5" stroke-opacity="0.7" />

  <!-- Radar Diagnostic Reticle / Concentric Circles -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#1F242D" stroke-width="1.5" stroke-dasharray="4 6" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#1F242D" stroke-width="1.5" />
  <circle cx="256" cy="256" r="64" fill="none" stroke="#1F242D" stroke-width="1.5" stroke-dasharray="2 4" />

  <!-- Scope Crosshairs (Precision Reticle) -->
  <line x1="80" y1="256" x2="432" y2="256" stroke="#1C222C" stroke-width="1.5" />
  <line x1="256" y1="80" x2="256" y2="432" stroke="#1C222C" stroke-width="1.5" />

  <!-- Axis Tick Marks -->
  <line x1="256" y1="136" x2="256" y2="144" stroke="#7D8590" stroke-width="2" />
  <line x1="256" y1="196" x2="256" y2="204" stroke="#7D8590" stroke-width="2" />
  <line x1="256" y1="308" x2="256" y2="316" stroke="#7D8590" stroke-width="2" />
  <line x1="256" y1="368" x2="256" y2="376" stroke="#7D8590" stroke-width="2" />

  <line x1="136" y1="256" x2="144" y2="256" stroke="#7D8590" stroke-width="2" />
  <line x1="196" y1="256" x2="204" y2="256" stroke="#7D8590" stroke-width="2" />
  <line x1="308" y1="256" x2="316" y2="256" stroke="#7D8590" stroke-width="2" />
  <line x1="368" y1="256" x2="376" y2="256" stroke="#7D8590" stroke-width="2" />

  <!-- Radar Beam Sweep (Upper-Right Quadrant 45 deg) -->
  <path d="M 256 256 L 380 132 A 176 176 0 0 0 256 80 Z" fill="url(#radarSweep)" />

  <!-- Telemetry Heartbeat / Oscilloscope Pulse Waveform -->
  <!-- Shadow/Ambient Trace -->
  <path d="M 80 256 
           L 160 256 
           L 185 220 
           L 205 292 
           L 225 256 
           L 245 256 
           L 260 148 
           L 282 352 
           L 302 232 
           L 320 256 
           L 432 256" 
        fill="none" 
        stroke="#0284C7" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.25" />

  <!-- Primary Crisp Instrumentation Pulse -->
  <path d="M 80 256 
           L 160 256 
           L 185 220 
           L 205 292 
           L 225 256 
           L 245 256 
           L 260 148 
           L 282 352 
           L 302 232 
           L 320 256 
           L 432 256" 
        fill="none" 
        stroke="url(#pulseLineGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Active Telemetry Ping Heads (Nodes) -->
  <!-- Peak Node -->
  <circle cx="260" cy="148" r="5" fill="#38BDF8" stroke="#0B0E14" stroke-width="2" />
  <!-- Recovery Node -->
  <circle cx="302" cy="232" r="3.5" fill="#38BDF8" />

  <!-- Live Status LED (Online / Healthy Emerald Indicator at top-right) -->
  <circle cx="416" cy="96" r="14" fill="#0B0E14" stroke="#1F242D" stroke-width="2" />
  <circle cx="416" cy="96" r="8" fill="#10B981" />
  <circle cx="414" cy="94" r="2.5" fill="#A7F3D0" />
</svg>
